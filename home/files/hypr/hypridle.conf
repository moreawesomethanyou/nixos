# Команды экрана идут через ~/.local/bin/hypr-dpms, а не напрямую через
# hyprctl dispatch 'hl.dsp.dpms(...)'. Причина: в Hyprland 0.56 этот
# диспетчер игнорирует аргумент и всегда переключает экран, поэтому
# "включить" при пробуждении на деле выключало. Подробности — в скрипте.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = /home/roman/.local/bin/hypr-dpms on
}

