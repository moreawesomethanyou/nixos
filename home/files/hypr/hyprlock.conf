general {
    hide_cursor = true
    grace = 3
    no_fade_in = false
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 6
    brightness = 0.6
}

input-field {
    monitor =
    size = 320, 52
    position = 0, -60
    halign = center
    valign = center
    outline_thickness = 2
    outer_color = rgba(122, 162, 247, 0.9)
    inner_color = rgba(26, 27, 38, 0.85)
    font_color = rgb(192, 202, 245)
    check_color = rgba(158, 206, 106, 0.9)
    fail_color = rgba(247, 118, 142, 0.9)
    placeholder_text = <span foreground="##8189af">Пароль…</span>
    fail_text = <span foreground="##f7768e">Неверный пароль</span>
    rounding = 12
    fade_on_empty = false
    dots_center = true
}

label {
    monitor =
    text = $TIME
    font_size = 88
    font_family = JetBrainsMono Nerd Font
    color = rgba(192, 202, 245, 0.95)
    position = 0, 180
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    font_size = 20
    font_family = Noto Sans
    color = rgba(169, 177, 214, 0.85)
    position = 0, 90
    halign = center
    valign = center
}
